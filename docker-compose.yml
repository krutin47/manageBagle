# Local development database only:  docker compose up -d db
# Full production-like stack:        docker compose --profile app up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: managebagle
      POSTGRES_PASSWORD: managebagle
      POSTGRES_DB: managebagle_dev
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U managebagle -d managebagle_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development here only so sign-in cookies work over plain http://localhost.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5434;Database=managebagle_dev;Username=managebagle;Password=managebagle
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8080:8080"

volumes:
  db-data:
