name: Deploy

# Called by release.yml. Deploys one image digest to one environment on Azure Container Apps:
# infrastructure (infra/main.bicep) → migrations (a Container Apps job) → wait for the new revision
# to be ready → smoke test. Settings and secrets come from the GitHub environment (docs/azure-setup.md).
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      ENV_NAME: ${{ inputs.environment == 'production' && 'prod' || 'uat' }}
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to Azure (OpenID Connect, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Infrastructure and the new revision
        id: infra
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          az deployment group create -g "$RG" -n "managebagle-$ENV_NAME-${GITHUB_RUN_ID}" -f infra/main.bicep \
            -p environmentName="$ENV_NAME" image="${{ inputs.image }}" \
               postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" publicUrl="${{ vars.PUBLIC_URL }}" \
               smtpHost="${{ vars.SMTP_HOST }}" smtpUsername="${{ vars.SMTP_USERNAME }}" smtpFrom="${{ vars.SMTP_FROM }}" smtpPassword="$SMTP_PASSWORD" \
               googleClientId="${{ vars.GOOGLE_CLIENT_ID }}" googleClientSecret="$GOOGLE_CLIENT_SECRET" \
               microsoftClientId="${{ vars.MICROSOFT_CLIENT_ID }}" microsoftClientSecret="$MICROSOFT_CLIENT_SECRET" \
               sentryDsn="$SENTRY_DSN" anthropicApiKey="$ANTHROPIC_API_KEY" \
               ghcrUsername="${{ github.repository_owner }}" ghcrPullToken="$GHCR_PULL_TOKEN" \
            --query properties.outputs -o json > outputs.json
          echo "url=$(jq -r .appUrl.value outputs.json)" >> "$GITHUB_OUTPUT"
          echo "job=$(jq -r .migrationJobName.value outputs.json)" >> "$GITHUB_OUTPUT"
      - name: Apply migrations (release step)
        run: |
          execution="$(az containerapp job start -n "${{ steps.infra.outputs.job }}" -g "$RG" --query name -o tsv)"
          for i in $(seq 1 60); do
            status="$(az containerapp job execution show -n "${{ steps.infra.outputs.job }}" -g "$RG" --job-execution-name "$execution" --query properties.status -o tsv)"
            echo "migration: $status"
            [ "$status" = "Succeeded" ] && exit 0
            [ "$status" = "Failed" ] && exit 1
            sleep 10
          done
          echo "::error::Migrations did not finish in 10 minutes"; exit 1
      - name: Smoke test
        env:
          URL: ${{ steps.infra.outputs.url }}
        run: |
          for i in $(seq 1 60); do curl -fs "$URL/health/ready" > /dev/null && break; sleep 10; done
          curl -fs "$URL/health/ready"
          curl -fsI "$URL/" | tee headers.txt
          grep -qi "strict-transport-security" headers.txt
          # A write must be accepted, which proves the app sees HTTPS through the Azure ingress
          # (otherwise it refuses writes). Resending a confirmation to an unknown address sends nothing.
          token="$(curl -fs -c jar -b jar -H 'X-MB-Client: release' "$URL/api/auth/csrf" | jq -r .token)"
          code="$(curl -s -o /dev/null -w '%{http_code}' -c jar -b jar -X POST "$URL/api/auth/email/resend" \
            -H 'X-MB-Client: release' -H "X-CSRF-TOKEN: $token" -H 'Content-Type: application/json' \
            -d '{"email":"release-smoke-test@example.invalid"}')"
          test "$code" = "202" || { echo "::error::A write was refused ($code): check ForwardedHeaders settings"; exit 1; }
          echo "Deployed ${{ inputs.image }} to $URL" >> "$GITHUB_STEP_SUMMARY"
