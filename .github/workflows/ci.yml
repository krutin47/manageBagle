name: CI

on:
  pull_request:
    branches: [dev, uat, main]
  push:
    branches: [dev, uat, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Client (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (includes the WCAG contrast checks)
        run: npm test
      - run: npm run build

  server:
    name: Server (build, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: managebagle
          POSTGRES_PASSWORD: managebagle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U managebagle"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build server/ManageBagle.slnx -c Release -warnaserror
      - run: dotnet test server/ManageBagle.slnx -c Release --no-build
        env:
          MB_TEST_POSTGRES: Host=localhost;Port=5432;Username=managebagle;Password=managebagle

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    needs: [client, server]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t managebagle:${{ github.sha }} .
